# Build nga GitHub — NUK nevojitet Maven/Java ne Web Terminal
# Para apply: oc project iridalala-dev
# Aplikacioni: projektcloud | Namespace: iridalala-dev
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: projektcloud
  labels:
    app: projektcloud
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: projektcloud-git
  labels:
    app: projektcloud
spec:
  source:
    type: Git
    git:
      uri: https://github.com/irida22/ProjektCloud.git
      ref: main
    contextDir: student-management
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile.multistage
  output:
    to:
      kind: ImageStreamTag
      name: projektcloud:latest
  triggers:
    - type: ConfigChange
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: projektcloud
  labels:
    app: projektcloud
  annotations:
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"projektcloud:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"projektcloud\")].image"}]
spec:
  replicas: 1
  selector:
    matchLabels:
      app: projektcloud
  template:
    metadata:
      labels:
        app: projektcloud
    spec:
      containers:
        - name: projektcloud
          image: image-registry.openshift-image-registry.svc:5000/iridalala-dev/projektcloud:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: openshift
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: projektcloud
  labels:
    app: projektcloud
spec:
  selector:
    app: projektcloud
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: projektcloud
spec:
  to:
    kind: Service
    name: projektcloud
  port:
    targetPort: 8080
  tls:
    termination: edge
